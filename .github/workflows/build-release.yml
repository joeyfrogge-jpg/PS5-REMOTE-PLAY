name: Build Windows Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "PS5-REMOTE-PLAY" --add-data "src;src" main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PS5-REMOTE-PLAY-windows
          path: dist/PS5-REMOTE-PLAY.exe
          retention-days: 30

      # Only create a formal GitHub Release when a version tag is pushed
      - name: Create GitHub Release and attach .exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PS5-REMOTE-PLAY.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
